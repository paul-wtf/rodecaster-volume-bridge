[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rodecaster-volume-bridge"
version = "0.1.0"
description = "Bridge a RodeCaster MIDI fader to Spotify or Tidal volume"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "websockets>=12",
    "tomli-w>=1.0",
    "dbus-fast>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
rodecaster-volume-bridge = "rodecaster_volume_bridge.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
